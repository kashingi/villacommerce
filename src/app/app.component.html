<mat-card class="mt-5 mt-3 p-4">
  <div class="row align-items-center">

    <div class="col-lg-4 col-md-5 col-sm-12 mb-3 mb-lg-0">
      <h2 class="text-info mb-0">
        Welcome to Villa Ecommerce
      </h2>
    </div>

    <div class="col-lg-5 col-md-5 col-sm-12 mb-3 mb-lg-0">
      <p class="text-secondary mb-0">
        Your one-stop shop for all your needs. Explore our wide range of
        products and enjoy a seamless shopping experience.
      </p>
    </div>

    <div class="col-lg-3 col-md-2 col-sm-12 text-center">
      <button class="w-100"
        mat-raised-button
        color="primary"
        (click)="showSnackbar()">
        Get Started
      </button>
    </div>

  </div>
</mat-card>
